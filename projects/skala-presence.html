<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKALA 재실 측정 수집 에이전트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#0066cc;
    --canvas:#ffffff;
    --parchment:#f5f5f7;
    --ink:#1d1d1f;
    --ink-muted-80:#333333;
    --ink-muted-48:#6a6a70;
    --hairline:#e0e0e0;
    --divider-soft:rgba(0,0,0,0.06);
    --red:#c0392b;
    --red-bg:rgba(192,57,43,0.08);
    --green:#1e965a;
    --green-bg:rgba(30,150,90,0.10);
    --blue-bg:rgba(0,102,204,0.08);
    --radius-lg:18px;
    --radius-pill:9999px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--canvas); color:var(--ink);
    font-family:-apple-system, system-ui, 'Inter', sans-serif;
    line-height:1.47; -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  code{
    font-family:'JetBrains Mono', monospace; font-size:0.86em;
    background:var(--parchment); padding:2px 6px; border-radius:5px; color:var(--ink);
  }

  nav{
    display:flex; justify-content:space-between; align-items:center;
    padding:0 32px; height:52px;
    border-bottom:1px solid var(--divider-soft);
    background:rgba(245,245,247,0.8);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    position:sticky; top:0; z-index:10;
  }
  .back-link{ font-size:14px; color:var(--primary); }
  .back-link:hover{ opacity:0.75; }
  .nav-note{
    font-size:13px; color:var(--ink-muted-48);
    background:var(--parchment); padding:6px 14px; border-radius:var(--radius-pill);
  }

  .wrap{ max-width:1160px; margin:0 auto; padding:0 40px; }

  /* ---- HERO (요약) ---- */
  .hero{ padding:44px 0 28px; }
  .hero .role-line{
    font-size:13px; font-weight:600; color:var(--primary);
    letter-spacing:0.5px; text-transform:uppercase; margin-bottom:10px;
  }
  .badge{
    display:inline-block; font-size:12px; font-weight:500; color:var(--ink-muted-48);
    background:var(--parchment); padding:5px 12px; border-radius:var(--radius-pill);
    margin-left:10px;
  }
  .hero h1{ font-size:clamp(30px,4.4vw,46px); font-weight:600; letter-spacing:-0.5px; line-height:1.12; margin-bottom:8px; }
  .hero .meta{ font-size:15px; color:var(--ink-muted-48); margin-bottom:20px; }
  .repo-note{
    font-size:13.5px; color:var(--ink-muted-48);
    border:1px dashed var(--hairline); border-radius:12px; padding:12px 16px;
    max-width:640px; line-height:1.55;
  }
  .repo-note strong{ color:var(--ink-muted-80); font-weight:600; }

  .divider{ height:1px; background:var(--hairline); margin:0 0 40px; }

  /* ---- 다이어그램 (아키텍처 · 데이터플로우 · 시퀀스) ---- */
  .diagrams{ margin-bottom:56px; }
  .diagrams > h2{ font-size:28px; font-weight:600; letter-spacing:-0.5px; margin-bottom:6px; }
  .dg-note{ font-size:15.5px; line-height:1.6; color:var(--ink-muted-80); margin-bottom:20px; max-width:760px; }
  .dg-tabs{ display:inline-flex; gap:4px; padding:4px; background:var(--parchment); border:1px solid var(--hairline); border-radius:var(--radius-pill); margin-bottom:18px; flex-wrap:wrap; }
  .dg-tab{ font-size:14px; font-weight:500; color:var(--ink-muted-48); padding:8px 18px; border-radius:var(--radius-pill); cursor:pointer; border:none; background:transparent; transition:color .15s ease, background .15s ease; font-family:inherit; }
  .dg-tab:hover{ color:var(--ink); }
  .dg-tab.active{ color:#fff; background:var(--primary); }
  .dg-panel{ display:none; border:1px solid var(--hairline); border-radius:var(--radius-lg); background:var(--canvas); padding:26px 22px; }
  .dg-panel.active{ display:block; }
  .dg-panel .mermaid{ text-align:center; overflow-x:auto; min-height:40px; }
  .dg-panel .mermaid svg{ max-width:100%; height:auto; }
  .dg-cap{ font-size:13.5px; color:var(--ink-muted-48); text-align:center; margin-top:16px; line-height:1.6; max-width:720px; margin-left:auto; margin-right:auto; }

  /* ---- 2단 레이아웃: 좌 Overview(요약) / 우 문제 토글(강조) ---- */
  .work-layout{
    display:grid; grid-template-columns:340px minmax(0,1fr); gap:56px;
    align-items:start; margin-bottom:64px;
  }
  .overview-pane{ position:sticky; top:76px; }
  .ov-oneliner{ font-size:16.5px; line-height:1.64; color:var(--ink); margin-bottom:24px; }
  .ov-label{
    font-size:12px; font-weight:600; color:var(--ink-muted-48);
    letter-spacing:0.6px; text-transform:uppercase; margin-bottom:11px;
  }
  .ov-block{ margin-bottom:24px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    font-size:14px; font-weight:500; color:var(--ink);
    background:var(--parchment); border:1px solid var(--hairline);
    padding:7px 13px; border-radius:var(--radius-pill);
  }
  .chip.accent{ color:var(--primary); background:var(--blue-bg); border-color:transparent; }
  .ov-did{ list-style:none; display:flex; flex-direction:column; gap:9px; }
  .ov-did li{ font-size:14px; line-height:1.5; color:var(--ink); padding-left:15px; position:relative; }
  .ov-did li::before{
    content:""; position:absolute; left:0; top:8px; width:6px; height:6px; border-radius:2px; background:var(--primary);
  }
  .ov-did li strong{ font-weight:600; }
  .ov-scope{
    font-size:13.5px; line-height:1.55; color:var(--ink-muted-80); margin-top:14px;
  }
  .ov-facts{ display:flex; flex-direction:column; gap:0; border:1px solid var(--hairline); border-radius:14px; overflow:hidden; }
  .ov-fact{ display:flex; gap:12px; padding:12px 15px; font-size:14.5px; }
  .ov-fact:not(:last-child){ border-bottom:1px solid var(--hairline); }
  .ov-fact .k{ width:48px; flex-shrink:0; color:var(--ink-muted-48); font-weight:500; }
  .ov-fact .v{ color:var(--ink); }

  /* ---- 문제 패널 (강조) ---- */
  .problems-head{ display:flex; align-items:baseline; gap:12px; margin-bottom:22px; }
  .problems-head h2{ font-size:31px; font-weight:600; letter-spacing:-0.5px; }
  .problems-head .count{
    font-size:15px; font-weight:600; color:var(--ink-muted-48);
    background:var(--parchment); padding:3px 12px; border-radius:var(--radius-pill);
  }

  details.problem{
    border:1px solid var(--hairline); border-radius:18px; margin-bottom:12px;
    background:var(--canvas); overflow:hidden; transition:border-color .15s ease;
  }
  details.problem:hover{ border-color:#c9c9cf; }
  details.problem[open]{ border-color:#b9b9c0; }
  details.problem summary{
    list-style:none; cursor:pointer; padding:22px 24px;
    display:flex; align-items:flex-start; gap:14px;
  }
  details.problem summary::-webkit-details-marker{ display:none; }
  .sum-main{ flex:1; min-width:0; }
  .p-tags{ display:flex; gap:6px; margin-bottom:7px; flex-wrap:wrap; }
  .p-tag{
    font-size:12px; font-weight:600; letter-spacing:0.3px;
    color:var(--ink-muted-48); background:var(--parchment);
    padding:4px 10px; border-radius:var(--radius-pill);
  }
  .p-tag.primary{ color:var(--ink-muted-80); background:var(--parchment); }
  .sum-main h3{ font-size:21px; font-weight:600; letter-spacing:-0.3px; line-height:1.32; color:var(--ink); }
  .p-teaser{ font-size:16px; color:var(--ink-muted-80); margin-top:6px; line-height:1.5; }
  .p-chevron{
    flex-shrink:0; width:22px; height:22px; margin-top:2px; position:relative;
  }
  .p-chevron::before, .p-chevron::after{
    content:""; position:absolute; top:10px; width:10px; height:2px;
    background:var(--ink-muted-48); border-radius:2px; transition:transform .2s ease;
  }
  .p-chevron::before{ left:2px; transform:rotate(45deg); }
  .p-chevron::after{ right:2px; transform:rotate(-45deg); }
  details.problem[open] .p-chevron::before{ transform:rotate(-45deg); }
  details.problem[open] .p-chevron::after{ transform:rotate(45deg); }
  details.problem[open] .p-chevron::before, details.problem[open] .p-chevron::after{ background:var(--ink-muted-80); }

  .p-body{ padding:2px 24px 24px; }
  .p-part{ padding:18px 0; border-top:1px solid var(--divider-soft); }
  .p-part:first-child{ border-top:none; padding-top:8px; }
  .p-label{
    display:inline-block; font-size:12px; font-weight:700; letter-spacing:0.8px;
    text-transform:uppercase; color:var(--ink-muted-48); margin-bottom:12px;
  }
  .lbl-problem, .lbl-action, .lbl-result{ color:var(--ink-muted-48); }
  .lbl-analyze{ color:var(--primary); }
  .p-part.analyze-part{ border-left:2px solid var(--primary); padding-left:16px; }
  .p-text p{ font-size:17.5px; line-height:1.7; color:#2b2b2e; margin-bottom:13px; }
  .p-text p:last-child{ margin-bottom:0; }
  .p-text p strong{ color:var(--ink); font-weight:600; }

  pre.snippet{
    font-family:'JetBrains Mono', monospace; font-size:13px; line-height:1.6;
    background:#1d1d1f; color:#f0f0f2; border-radius:10px; padding:15px 16px;
    overflow-x:auto; margin:12px 0 4px;
  }

  .metric-line{ display:flex; gap:26px; flex-wrap:wrap; margin-top:16px; }
  .metric .v{ font-size:19px; font-weight:600; letter-spacing:-0.374px; display:block; color:var(--ink); }
  .metric .k{ color:var(--ink-muted-48); font-size:13px; }

  .aside{ border-left:3px solid var(--primary); padding:2px 0 2px 14px; margin:14px 0 2px; }
  .aside p{ font-size:14px; line-height:1.6; color:var(--ink-muted-48); }
  .aside.warn{ border-left-color:var(--red); }
  .aside.warn p{ color:var(--ink-muted-80); }

  /* ---- 회고 (요약, 전체폭) ---- */
  .retro-wrap{ margin-bottom:64px; }
  .retro-wrap > h2{ font-size:28px; font-weight:600; letter-spacing:-0.5px; margin-bottom:16px; }
  .retro{ background:var(--parchment); border-radius:var(--radius-lg); padding:30px 32px; }
  .retro > p{ font-size:17px; line-height:1.64; color:#2b2b2e; }
  .retro ul{ list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:14px 32px; margin-top:20px; }
  .retro li{ font-size:16px; line-height:1.6; color:#2b2b2e; padding-left:18px; position:relative; }
  .retro li::before{
    content:""; position:absolute; left:0; top:8px; width:6px; height:6px; border-radius:50%; background:var(--primary);
  }
  .retro li strong{ color:var(--ink); font-weight:600; }
  .retro .closing{ margin-top:18px; font-size:15.5px; }

  /* ---- 기술 스택 · 아키텍처 (무엇을 어디에) ---- */
  .arch-wrap{ margin-bottom:60px; }
  .arch-wrap > h2{ font-size:28px; font-weight:600; letter-spacing:-0.5px; margin-bottom:6px; }
  .arch-note{ font-size:15.5px; line-height:1.6; color:var(--ink-muted-80); margin-bottom:22px; max-width:760px; }
  .arch-table{ border:1px solid var(--hairline); border-radius:var(--radius-lg); overflow:hidden; }
  .arch-row{ display:grid; grid-template-columns:118px 1.1fr 1.3fr; gap:24px; padding:16px 24px; align-items:baseline; }
  .arch-row:not(:last-child){ border-bottom:1px solid var(--hairline); }
  .arch-row .cat{ font-size:13px; font-weight:700; letter-spacing:0.3px; color:var(--ink-muted-48); text-transform:uppercase; }
  .arch-row .tech{ font-size:16px; font-weight:600; color:var(--ink); line-height:1.4; }
  .arch-row .where{ font-size:15px; line-height:1.5; color:var(--ink-muted-80); }
  .arch-head{ background:var(--parchment); }
  .arch-head > div{ font-size:12px; font-weight:700; letter-spacing:0.4px; color:var(--ink-muted-48); text-transform:uppercase; }
  @media (max-width:640px){ .arch-row{ grid-template-columns:1fr; gap:5px; padding:14px 18px; } .arch-head{ display:none; } }

  footer{
    max-width:1160px; margin:0 auto; padding:30px 40px 72px;
    border-top:1px solid var(--hairline);
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;
  }
  footer a{ font-size:15px; color:var(--primary); }
  footer a:hover{ opacity:0.75; }
  footer .foot-note{ font-size:13px; color:var(--ink-muted-48); }

  @media (max-width:860px){
    .work-layout{ grid-template-columns:1fr; gap:36px; }
    .overview-pane{ position:static; }
    .retro ul{ grid-template-columns:1fr; }
  }
  @media (max-width:640px){
    nav, .wrap, footer{ padding-left:20px; padding-right:20px; }
    .hero{ padding:32px 0 24px; }
    .problems-head h2{ font-size:22px; }
  }
</style>
</head>
<body>

<nav>
  <a class="back-link" href="../index.html">← 포트폴리오</a>
  <span class="nav-note">저장소 비공개 · 사내 인프라</span>
</nav>

<div class="wrap">
  <section class="hero" id="heroSection"></section>
  <div class="divider"></div>
  <section class="diagrams" id="diagramsSection"></section>
  <div class="work-layout">
    <aside class="overview-pane" id="overviewPane"></aside>
    <main class="problems-pane" id="problemsPane"></main>
  </div>
  <section class="arch-wrap" id="archSection"></section>
  <section class="retro-wrap" id="retroSection"></section>
</div>

<footer>
  <a href="../index.html">← 모든 프로젝트 보기</a>
  <span class="foot-note" id="footNote"></span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
/* ============================================================
   SKALA 재실 측정 수집 에이전트 상세페이지 — 내용은 이 CONTENT 객체만 수정하세요.

   설계 의도 (면접관이 빠르게 넘기다 멈추게):
   - 왼쪽 Overview = 요약 (무슨 프로젝트 / 무슨 역할)
   - 오른쪽 = 맞닥뜨린 문제들을 토글 카드로 크게
   - 카드를 열면  문제 정의 → 분석·왜 이렇게 → 실행 → 결과  순 (PAAR)

   ⚠️ 보안: 사내 IP·D1 database ID·토큰·직원 실명은 절대 넣지 않는다.
      (OUI 00:E0:4C 은 공개된 벤더 프리픽스라 무방. 스키마 컬럼명은 비밀 아님.)
   ============================================================ */
const CONTENT = {
  roleLine: "Data Collection · Network Measurement",
  badge: "PoC · 방향 전환",
  title: "SKALA 재실 측정 — 사내망을 ARP로 스캔해 '켜진 PC'를 세는 수집 에이전트",
  meta: "SKALA · 사내 재실 측정 수집 에이전트(scan/sync) 담당 · 데이터 품질·비용 사고 대응",
  repoNote: "이 프로젝트는 <strong>사내망 인프라</strong>(대역·기기·D1 접속정보)를 다뤄 저장소를 비공개로 유지합니다. 아래 내용은 민감정보를 뺀 접근·판단 과정만 정리한 것입니다.",

  /* ---- 구조 다이어그램 (진입 즉시 시각화) ----
     ⚠️ 보안: 사내 IP·D1 database ID·토큰·실명은 넣지 않는다. 일반 명칭만 사용. */
  diagrams: {
    note: "제가 맡은 수집(scan/sync)·데이터 품질을 세 관점으로 그렸습니다. 파란 강조는 직접 구현·대응한 부분입니다.",
    tabs: [
      { key: "arch", label: "아키텍처",
        cap: "수집 에이전트가 사내망을 arp-scan으로 훑어 로컬 SQLite에 쌓고, 증분만 Cloudflare D1로 보냅니다. 매칭·집계는 팀원 서비스 몫입니다.",
        def: `flowchart LR
  subgraph LAN["사내망 (L2)"]
    PC["직원 PC · 유선/유닛"]
  end
  subgraph AG["수집 에이전트 (macOS · launchd)"]
    SC["arp-scan<br/>능동 ARP 스캔"] --> QC["이상치·패턴 분류<br/>arp_pattern.py"]
    QC --> LDB[("SQLite<br/>local.db")]
    LDB --> SY["증분 sync<br/>REST"]
  end
  PC -. ARP 응답 .-> SC
  SY -->|append-only mac_status| D1[("Cloudflare D1")]
  D1 --> MT["팀원: MAC↔사원 매칭 · 집계"]
  classDef me fill:#e9f2fc,stroke:#0066cc,color:#0b3d91,stroke-width:1.5px;
  class SC,QC,LDB,SY me` },
      { key: "flow", label: "데이터플로우",
        cap: "1분 주기로 ARP 응답을 모아 이상치(슬립 랩탑의 ARP offload)를 걸러내고, Realtek OUI만 '유선 PC'로 세어 증분만 D1에 upsert합니다.",
        def: `flowchart TB
  tick["1분 주기 (정각 정렬)"] --> scan["arp-scan 요청"]
  scan --> resp["응답 IP · MAC 수집<br/>응답만 is_on=1"]
  resp --> oui{"OUI 00:E0:4C — 유선 직원 PC?"}
  oui -->|아니오| drop["카운트 제외"]
  oui -->|예| offload{"야간·주말 상시 ON — ARP offload?"}
  offload -->|이상치| tag["방치성으로 분류"]
  offload -->|정상| keep["실사용 신호"]
  tag --> ldb[("SQLite local.db")]
  keep --> ldb
  ldb -->|measured_at 커서 증분| d1[("Cloudflare D1")]
  classDef me fill:#e9f2fc,stroke:#0066cc,color:#0b3d91,stroke-width:1.5px;
  class oui,offload,ldb me` },
      { key: "seq", label: "시퀀스 · 수집 사이클",
        cap: "한 번의 수집 사이클: 스캔 → 응답 수집 → 이상치 제거 → 로컬 저장 → 증분 커서로 D1 전송. 캐시가 아니라 매번 능동 스캔이라 STALE이 섞이지 않습니다.",
        def: `sequenceDiagram
  autonumber
  participant T as launchd (1분)
  participant A as 수집 에이전트
  participant N as 사내망 (ARP)
  participant L as SQLite local.db
  participant D as Cloudflare D1
  T->>A: 주기 실행 트리거
  A->>N: arp-scan 능동 스캔
  N-->>A: 응답 IP · MAC (현재 켜진 기기)
  A->>A: Realtek OUI 필터 · 이상치 분류
  A->>L: is_on=1 행 기록 (append-only)
  Note over A,D: 전체 재조회 대신 증분만
  A->>D: measured_at 커서 이후만 sync
  D-->>A: upsert 완료` }
    ]
  },

  /* ---- 왼쪽: Overview (요약) ---- */
  overview: {
    oneliner: "실제 자리에 앉아 일·공부하는 사람 수를 파악해(냉방 등 운영 인사이트) 위해, 사내망을 ARP로 스캔해 '지금 켜져 있는 PC'를 1분마다 수집해 Cloudflare D1로 보내는 수집 에이전트. 스캔·전송과 데이터 품질, 그리고 비용 사고 대응을 제가 맡았습니다.",
    did: [

/* ============================================================
   렌더링 로직 (수정 불필요)
   ============================================================ */
const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* Mermaid — 사이트 디자인(블루 액센트·파치먼트)으로 테마링, 탭 전환 시 지연 렌더 */
let _mReady = false;
function initMermaid(){
  if (_mReady || !window.mermaid) return _mReady;
  mermaid.initialize({
    startOnLoad: false, securityLevel: "loose", theme: "base",
    flowchart: { curve: "basis", padding: 14, useMaxWidth: true },
    sequence: { useMaxWidth: true, mirrorActors: false },
    themeVariables: {
      fontFamily: "-apple-system, system-ui, Inter, sans-serif", fontSize: "14px",
      primaryColor: "#f5f5f7", primaryTextColor: "#1d1d1f", primaryBorderColor: "#c9c9cf",
      lineColor: "#8a8a8f", secondaryColor: "#eef4fb", tertiaryColor: "#ffffff",
      clusterBkg: "#fafafa", clusterBorder: "#e0e0e0",
      actorBkg: "#f5f5f7", actorBorder: "#c9c9cf", actorTextColor: "#1d1d1f", actorLineColor: "#c9c9cf",
      signalColor: "#6a6a70", signalTextColor: "#1d1d1f",
      noteBkgColor: "#eef4fb", noteBorderColor: "#c9dcf3", noteTextColor: "#0b3d75"
    }
  });
  _mReady = true;
  return true;
}
function renderMermaid(el){
  if (!window.mermaid){ setTimeout(() => renderMermaid(el), 60); return; }
  initMermaid();
  try { mermaid.run({ nodes: [el] }); } catch (e) { console.error("mermaid", e); }
}
function setupDiagrams(){
  const tabs = [...document.querySelectorAll(".dg-tab")];
  const panels = [...document.querySelectorAll(".dg-panel")];
  function show(key){
    tabs.forEach(t => t.classList.toggle("active", t.dataset.key === key));
    panels.forEach(p => p.classList.toggle("active", p.dataset.key === key));
    const panel = panels.find(p => p.dataset.key === key);
    const pre = panel && panel.querySelector(".mermaid");
    if (pre && !pre.getAttribute("data-processed")) renderMermaid(pre);
  }
  tabs.forEach(t => t.addEventListener("click", () => show(t.dataset.key)));
  if (tabs.length) show(tabs[0].dataset.key);
}

function render(){
  document.getElementById("footNote").textContent = "사내 인프라라 저장소는 비공개입니다.";

  document.getElementById("heroSection").innerHTML = `
    <div class="role-line">${CONTENT.roleLine}<span class="badge">${CONTENT.badge}</span></div>
    <h1>${CONTENT.title}</h1>
    <div class="meta">${CONTENT.meta}</div>
    <div class="repo-note">${CONTENT.repoNote}</div>
  `;

  if (CONTENT.diagrams) {
    const dg = CONTENT.diagrams;
    document.getElementById("diagramsSection").innerHTML = `
      <h2>구조 한눈에 보기</h2>
      <p class="dg-note">${dg.note}</p>
      <div class="dg-tabs">
        ${dg.tabs.map((t, i) => `<button class="dg-tab${i === 0 ? ' active' : ''}" data-key="${t.key}">${t.label}</button>`).join("")}
      </div>
      ${dg.tabs.map((t, i) => `
        <div class="dg-panel${i === 0 ? ' active' : ''}" data-key="${t.key}">
          <pre class="mermaid">${t.def}</pre>
          <div class="dg-cap">${t.cap}</div>
        </div>`).join("")}
    `;
    setupDiagrams();
  }

  const ov = CONTENT.overview;
  document.getElementById("overviewPane").innerHTML = `
    <p class="ov-oneliner">${ov.oneliner}</p>
    <div class="ov-block">
      <div class="ov-label">한 일</div>
      <ul class="ov-did">${ov.did.map(d => `<li>${d}</li>`).join("")}</ul>
      <div class="ov-scope">${ov.scope}</div>
    </div>
    <div class="ov-block">
      <div class="ov-label">핵심 정보</div>
      <div class="ov-facts">
        ${ov.facts.map(f => `<div class="ov-fact"><span class="k">${f.k}</span><span class="v">${f.v}</span></div>`).join("")}
      </div>
    </div>
  `;

  const part = (label, cls, texts, extra = "", blockClass = "") => `
    <div class="p-part ${blockClass}">
      <span class="p-label ${cls}">${label}</span>
      <div class="p-text">${(texts || []).map(t => `<p>${t}</p>`).join("")}${extra}</div>
    </div>`;

  document.getElementById("problemsPane").innerHTML = `
    <div class="problems-head">
      <h2>Trouble Shooting</h2>
      <span class="count">${CONTENT.problems.length}</span>
    </div>
    ${CONTENT.problems.map((p, i) => {
      const snippetHtml = p.snippet ? `<pre class="snippet">${esc(p.snippet)}</pre>` : "";
      const metricsHtml = (p.metrics && p.metrics.length) ? `
        <div class="metric-line">
          ${p.metrics.map(m => `<div class="metric"><span class="v">${m.v}</span><span class="k">${m.k}</span></div>`).join("")}
        </div>` : "";
      const asideHtml = p.aside ? `<div class="aside ${p.asideClass || ''}"><p>${p.aside}</p></div>` : "";
      return `
      <details class="problem"${i === 0 ? " open" : ""}>
        <summary>
          <div class="sum-main">
            <div class="p-tags">${p.tags.map((t, ti) => `<span class="p-tag${ti === 0 ? ' primary' : ''}">${t}</span>`).join("")}</div>
            <h3>${p.title}</h3>
            <div class="p-teaser">${p.teaser}</div>
          </div>
          <span class="p-chevron" aria-hidden="true"></span>
        </summary>
        <div class="p-body">
          ${part("문제", "lbl-problem", p.problem)}
          ${part("분석", "lbl-analyze", p.analyze, "", "analyze-part")}
          ${part("실행", "lbl-action", p.action, snippetHtml)}
          ${part("결과", "lbl-result", p.result, metricsHtml)}
          ${asideHtml}
        </div>
      </details>`;
    }).join("")}
  `;

  const a = CONTENT.architecture;
  document.getElementById("archSection").innerHTML = `
    <h2>사용 기술 및 적용 영역</h2>
    <p class="arch-note">${a.note}</p>
    <div class="arch-table">
      <div class="arch-row arch-head">
        <div>구분</div><div>기술</div><div>적용 영역</div>
      </div>
      ${a.rows.map(row => `
        <div class="arch-row">
          <div class="cat">${row.cat}</div>
          <div class="tech">${row.tech}</div>
          <div class="where">${row.where}</div>
        </div>`).join("")}
    </div>
  `;

  const r = CONTENT.retro;
  document.getElementById("retroSection").innerHTML = `
    <h2>지금 다시 한다면</h2>
    <div class="retro">
      <p>${r.intro}</p>
      <ul>${r.items.map(i => `<li>${i}</li>`).join("")}</ul>
      <p class="closing">${r.closing}</p>
    </div>
  `;
}
render();
</script>
