<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKIBA Backend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#0066cc;
    --canvas:#ffffff;
    --parchment:#f5f5f7;
    --ink:#1d1d1f;
    --ink-muted-80:#333333;
    --ink-muted-48:#7a7a7a;
    --hairline:#e0e0e0;
    --divider-soft:rgba(0,0,0,0.06);
    --radius-lg:18px;
    --radius-pill:9999px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--canvas); color:var(--ink);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    line-height:1.47; -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  code{
    font-family:'JetBrains Mono', monospace; font-size:0.88em;
    background:var(--parchment); padding:2px 6px; border-radius:5px; color:var(--ink);
  }

  nav{
    display:flex; justify-content:space-between; align-items:center;
    padding:0 32px; height:52px;
    border-bottom:1px solid var(--divider-soft);
    background:rgba(245,245,247,0.8);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    position:sticky; top:0; z-index:10;
  }
  .back-link{ font-size:14px; color:var(--primary); }
  .back-link:hover{ opacity:0.75; }
  .nav-code{
    background:var(--primary); color:#fff; font-size:14px;
    padding:7px 16px; border-radius:var(--radius-pill);
  }
  .nav-code:hover{ opacity:0.9; }

  .wrap{ max-width:720px; margin:0 auto; padding:0 32px; }

  .hero{ padding:56px 0 36px; }
  .badge{
    display:inline-block; font-size:12px; font-weight:500; color:var(--primary);
    background:rgba(0,102,204,0.08); padding:5px 12px; border-radius:var(--radius-pill);
    margin-bottom:16px;
  }
  .hero h1{ font-size:clamp(28px,4.2vw,40px); font-weight:600; letter-spacing:-0.28px; line-height:1.15; margin-bottom:10px; }
  .hero .meta{ font-size:14px; color:var(--ink-muted-48); margin-bottom:24px; }
  .link-row{ display:flex; gap:12px; flex-wrap:wrap; }
  .btn{ font-size:16px; font-weight:400; padding:11px 22px; border-radius:var(--radius-pill); display:inline-block; }
  .btn-primary{ background:var(--primary); color:#fff; }
  .btn-primary:hover{ opacity:0.9; }
  .btn-ghost{ color:var(--primary); border:1px solid var(--primary); }
  .btn-ghost:hover{ background:rgba(0,102,204,0.06); }

  .divider{ height:1px; background:var(--hairline); margin:0 0 48px; }

  section.block{ margin-bottom:56px; }
  section.block > h2{ font-size:24px; font-weight:600; letter-spacing:-0.374px; margin-bottom:18px; }
  section.block p{ font-size:17px; line-height:1.65; color:var(--ink-muted-80); margin-bottom:16px; }
  section.block p:last-child{ margin-bottom:0; }
  section.block p strong{ color:var(--ink); font-weight:600; }

  .overview-facts{ border:1px solid var(--hairline); border-radius:var(--radius-lg); overflow:hidden; margin-top:24px; }
  .fact-row{ display:flex; padding:14px 20px; gap:20px; }
  .fact-row:not(:last-child){ border-bottom:1px solid var(--hairline); }
  .fact-row .k{ width:110px; flex-shrink:0; font-size:14px; color:var(--ink-muted-48); }
  .fact-row .v{ font-size:16px; color:var(--ink); }

  ul.role-list{ list-style:none; display:flex; flex-direction:column; gap:18px; margin-top:20px; }
  ul.role-list li{ font-size:16px; color:var(--ink); font-weight:600; padding-left:20px; position:relative; }
  ul.role-list li::before{
    content:""; position:absolute; left:0; top:8px; width:7px; height:7px; border-radius:2px; background:var(--primary);
  }
  ul.role-list li .detail{ display:block; font-size:16px; line-height:1.6; color:var(--ink-muted-80); font-weight:400; margin-top:5px; }

  .stack-table{ border:1px solid var(--hairline); border-radius:var(--radius-lg); overflow:hidden; }
  .stack-row{ display:flex; padding:16px 20px; gap:20px; align-items:baseline; }
  .stack-row:not(:last-child){ border-bottom:1px solid var(--hairline); }
  .stack-row .cat{ width:120px; flex-shrink:0; font-size:14px; color:var(--ink-muted-48); }
  .stack-row .val .names{ font-size:16px; font-weight:600; }
  .stack-row .val .note{ display:block; font-size:15px; color:var(--ink-muted-80); margin-top:4px; }

  /* 구현 과정 */
  .story{ padding-top:8px; }
  .story + .story{ margin-top:44px; padding-top:44px; border-top:1px solid var(--hairline); }
  .story h3{ font-size:20px; font-weight:600; letter-spacing:-0.374px; line-height:1.35; margin-bottom:16px; }
  .story p{ font-size:17px; line-height:1.65; color:var(--ink-muted-80); margin-bottom:16px; }
  .story p:last-child{ margin-bottom:0; }
  .story p strong{ color:var(--ink); font-weight:600; }

  .aside{ border-left:3px solid var(--primary); padding:2px 0 2px 18px; margin:20px 0; }
  .aside p{ font-size:16px; line-height:1.6; color:var(--ink-muted-80); margin-bottom:8px; }
  .aside p:last-child{ margin-bottom:0; }

  pre.snippet{
    font-family:'JetBrains Mono', monospace; font-size:13.5px; line-height:1.6;
    background:var(--parchment); border-radius:12px; padding:16px 18px;
    overflow-x:auto; margin:18px 0; color:var(--ink);
  }

  .metric-line{
    display:flex; gap:28px; flex-wrap:wrap; margin-top:22px;
    padding-top:18px; border-top:1px solid var(--hairline);
  }
  .metric{ font-size:15px; }
  .metric .v{ font-size:19px; font-weight:600; letter-spacing:-0.374px; display:block; }
  .metric .k{ color:var(--ink-muted-48); font-size:13px; }

  .retro{ background:var(--parchment); border-radius:var(--radius-lg); padding:26px; }
  .retro p{ color:var(--ink-muted-80); }
  .retro ul{ list-style:none; display:flex; flex-direction:column; gap:12px; margin-top:16px; }
  .retro li{ font-size:16px; line-height:1.6; color:var(--ink-muted-80); padding-left:20px; position:relative; }
  .retro li::before{
    content:""; position:absolute; left:0; top:9px; width:6px; height:6px; border-radius:50%; background:var(--primary);
  }
  .retro li strong{ color:var(--ink); font-weight:600; }

  footer{
    max-width:720px; margin:0 auto; padding:32px 32px 72px;
    border-top:1px solid var(--hairline); margin-top:16px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;
  }
  footer a{ font-size:15px; color:var(--primary); }
  footer a:hover{ opacity:0.75; }

  @media (max-width:640px){
    nav, .wrap, footer{ padding-left:20px; padding-right:20px; }
    .hero{ padding:40px 0 28px; }
    .fact-row, .stack-row{ flex-direction:column; gap:4px; }
    .fact-row .k, .stack-row .cat{ width:auto; }
    .story h3{ font-size:18px; }
    footer{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>

<nav>
  <a class="back-link" href="../index.html">← 포트폴리오</a>
  <a class="nav-code" id="navCode" href="#">GitHub</a>
</nav>

<div class="wrap">
  <section class="hero" id="heroSection"></section>
  <div class="divider"></div>
  <section class="block" id="overviewSection"></section>
  <section class="block" id="roleSection"></section>
  <section class="block" id="stackSection"></section>
  <section class="block" id="storySection"></section>
  <section class="block" id="retroSection"></section>
</div>

<footer>
  <a href="../index.html">← 모든 프로젝트 보기</a>
  <a id="footerGithub" href="#">자세한 코드는 GitHub에서 →</a>
</footer>

<script>
/* ============================================================
   AKIBA 백엔드 상세페이지 — 내용은 이 CONTENT 객체만 수정하세요.
   섹션: Overview → 담당 역할 → 기술 스택 → 구현 과정 → 지금 다시 한다면
   ============================================================ */
const CONTENT = {
  badge: "개발 · 배포 완료",
  title: "AKIBA — 오타쿠 굿즈 마켓플레이스 백엔드",
  meta: "4인 팀 (백엔드 2) · 인증 · 실시간 채팅 · AWS 인프라 담당",
  githubUrl: "https://github.com/bethebestKR/AKIBA-Backend",

  // 서버를 내려둔 상태이므로 라이브 링크는 두지 않는다.
  // 죽은 링크는 없는 링크보다 신뢰를 크게 깎는다.
  links: [
    { label: "GitHub 코드 보기 →", href: "https://github.com/bethebestKR/AKIBA-Backend", primary: true },
    { label: "내 커밋 내역", href: "https://github.com/bethebestKR/AKIBA-Backend/commits/main?author=bethebestKR", primary: false }
  ],

  /* ---- 1. Overview ---- */
  overview: {
    paragraphs: [
      "오타쿠 굿즈를 사고팔고 정보를 나누는 마켓플레이스 겸 커뮤니티 서비스의 백엔드 API 서버입니다. 중고거래, 특전·한정판 거래, 경매, 커뮤니티, 판매자와의 실시간 채팅을 제공합니다.",
      "백엔드 2명 중 제가 맡은 영역은 <strong>AWS 서버 구축과 Docker 기반 CI/CD, OAuth2 소셜 로그인과 JWT 인증, WebSocket 실시간 채팅</strong>입니다. 경매·마켓 도메인 설계는 다른 백엔드 팀원이 담당했고, 이 문서는 제가 맡은 세 영역만 다룹니다.",
      "인프라는 담당자 없이 직접 EC2에 서버와 DB를 올리고 도메인·SSL·배포 파이프라인까지 구성했습니다. 운영하면서 마주친 문제 대부분이 애플리케이션 코드가 아니라 실행 환경 쪽에서 나왔고, 프론트엔드가 Flutter라 브라우저에서 되던 것이 실제 클라이언트에서는 다르게 동작하는 문제도 겪었습니다."
    ],
    facts: [
      { k: "담당", v: "AWS 인프라·CI/CD · OAuth2/JWT 인증 · WebSocket 채팅" },
      { k: "팀", v: "4인 (백엔드 2 · 프론트엔드 Flutter)" },
      { k: "서버", v: "EC2 단일 인스턴스 (t3.small, 1.9GB) — 앱 + MySQL 컨테이너 동거" },
      { k: "구성", v: "nginx(SSL·프록시) · app-dev · db-dev · db-prod 컨테이너" },
      { k: "배포", v: "GitHub Actions → DockerHub → EC2 SSH, push 후 약 2~3분" },
      { k: "현재 상태", v: "비용 문제로 인스턴스 종료. 코드와 아래 운영 기록으로 확인 가능" }
    ]
  },

  /* ---- 2. 담당 역할 ---- */
  myRole: {
    summary: "백엔드 2명 중 인증·실시간 통신을 맡고, 담당자가 없던 인프라·배포를 인수했습니다.",
    items: [
      { main: "AWS EC2 서버 구축", detail: "EC2를 새로 띄워 앱과 MySQL을 컨테이너로 올리고, 탄력적 IP·도메인·Let's Encrypt SSL·nginx 리버스 프록시를 직접 구성했습니다. dev와 prod의 DB 컨테이너와 도커 네트워크를 분리했습니다." },
      { main: "CI/CD 파이프라인 인수 및 서버 이전", detail: "전임자가 만든 배포 파이프라인을 넘겨받아, 제가 새로 구축한 EC2로 옮기고 dev·prod 환경 분리까지 마쳤습니다. 이후 배포 파이프라인 운영을 담당했습니다." },
      { main: "OAuth2 소셜 로그인 + JWT 인증", detail: "Google·Naver 인가 코드 교환부터 프로필 조회까지 직접 구현하고, 액세스·리프레시 토큰 발급과 갱신, 매 요청 토큰 검증 필터를 붙였습니다." },
      { main: "STOMP 기반 실시간 채팅", detail: "CONNECT 시점에 JWT를 한 번 검증해 세션에 사용자 정보를 저장하고, 이후 메시지 핸들러에서 토큰을 다시 파싱하지 않도록 구성했습니다." },
      { main: "S3 이미지 스토리지 전환", detail: "컨테이너를 재배포하면 업로드 이미지가 사라지는 문제를 해결하기 위해 저장 위치를 컨테이너 내부에서 S3로 옮겼습니다." }
    ]
  },

  /* ---- 3. 기술 스택 ----
     note는 실제로 판단 근거가 있었던 항목에만 쓴다.
     근거 없이 골랐던 것은 비워두고, 마지막 회고 섹션에서 다룬다. */
  stack: [
    { cat: "Language", names: "Java 21", note: "" },
    { cat: "Framework", names: "Spring Boot 3.5, Spring Data JPA", note: "" },
    { cat: "Database", names: "MySQL 8", note: "이전에 다뤄본 DB라 선택. 거래·입찰처럼 정합성이 필요한 도메인에는 맞았습니다" },
    { cat: "Auth", names: "OAuth2 (Google, Naver), JWT (jjwt)", note: "리프레시 토큰은 서버 측 엔티티로 저장 — 회수 가능하게 하기 위해" },
    { cat: "Realtime", names: "Spring WebSocket, STOMP, SockJS", note: "CONNECT 시점 1회 인증 후 세션 재사용" },
    { cat: "Infra", names: "AWS EC2, S3, Route 53, nginx, Docker", note: "탄력적 IP · Let's Encrypt SSL (운영 당시)" },
    { cat: "CI/CD", names: "GitHub Actions, DockerHub", note: "브랜치별 dev/prod 배포 분리" },
    { cat: "Client", names: "Flutter (프론트엔드 팀 담당)", note: "순수 WebSocket 클라이언트라 서버 설정에 영향" }
  ],

  /* ---- 4. 구현 과정 ----
     순서 원칙: 판단이 가장 많이 들어간 것부터. 상단 1/3에서 승부가 난다.
     ref 필드에 커밋·PR 링크를 넣으면 검증 경로가 생긴다 (저장소 공개 시). */
  stories: [
    {
      title: "STOMP CONNECT에 토큰을 실어 보냈는데 userId가 계속 null이었다",
      body: [
        "채팅 메시지를 보내면 저장이 되지 않았습니다. 핸들러에서 세션의 <code>userId</code>가 <code>null</code>로 나왔는데, 프론트는 CONNECT 프레임 헤더에 <code>Authorization: Bearer</code>를 정상적으로 실어 보내고 있었습니다. 토큰 검증 자체도 통과하고 있었습니다.",
        "검증은 되는데 저장한 값이 없다는 건 저장하는 쪽이 아니라 <strong>저장되는 대상이 잘못됐다</strong>는 뜻이라 보고 인터셉터를 역추적했습니다. <code>StompHeaderAccessor.wrap(message)</code>를 쓰고 있었고, 이 메서드는 원본 메시지를 복사해 새 accessor를 만듭니다. 거기에 값을 넣어도 실제 WebSocket 세션에는 반영되지 않습니다. 값이 갈 곳이 없었던 것이었습니다.",
        "원본 메시지에 붙어 있는 accessor를 그대로 참조하는 <code>MessageHeaderAccessor.getAccessor()</code>로 바꿔 해결했습니다. 같이 발견한 게 하나 더 있었는데, 토큰이 없거나 유효하지 않을 때 예외 없이 조용히 통과하는 구조였습니다. 인증 실패가 묵시적으로 넘어가면 누가 보냈는지 모르는 메시지가 들어올 수 있어서, <code>MessageDeliveryException</code>을 던지도록 함께 고쳤습니다."
      ],
      snippet: "// Before — 복사본이라 세션에 반영되지 않음\nStompHeaderAccessor accessor = StompHeaderAccessor.wrap(message);\naccessor.getSessionAttributes().put(\"userId\", userId);\n\n// After — 원본 메시지의 accessor를 참조\nStompHeaderAccessor accessor =\n    MessageHeaderAccessor.getAccessor(message, StompHeaderAccessor.class);",
      aside: [
        "CONNECT 시점에 한 번 검증해 세션에 <code>userId</code>를 남겨두면, 이후 메시지마다 토큰을 다시 파싱할 필요가 없습니다. 메시지 단위로 검증하는 방식과 비교해 매 전송의 비용이 줄어드는 대신, 연결이 유지되는 동안에는 토큰 만료를 반영하지 못하는 트레이드오프가 있습니다."
      ],
      metrics: []
    },
    {
      title: "로컬에서 되던 WebSocket이 dev 서버에서만 400으로 끊겼다",
      body: [
        "Flutter 클라이언트에서 <code>wss://</code>로 연결하면 핸드셰이크 단계에서 400이 떨어졌습니다. 로컬에서는 문제가 없었고 배포 서버에서만 재현됐습니다. 코드가 같은데 환경만 다르니 서버 앞단을 의심했습니다.",
        "원인이 두 개였습니다. 하나는 클라이언트 경로였습니다. 로컬 테스트는 SockJS 클라이언트로 했는데 실제 Flutter의 <code>stomp_dart_client</code>는 순수 WebSocket이라 SockJS 협상 과정이 없고, 서버가 <code>withSockJS()</code>로 등록돼 있으면 순수 WebSocket용 경로는 <code>/ws/chat/websocket</code>이었습니다. <strong>테스트에 쓴 클라이언트와 실제 클라이언트가 달라서 로컬에서 걸러지지 않은 문제였습니다.</strong>",
        "더 큰 원인은 nginx였습니다. WebSocket은 HTTP 연결을 프로토콜 전환으로 승격시키는데, nginx 설정에 그 전환 신호를 백엔드로 넘기는 헤더가 없었습니다. 프록시가 일반 HTTP 요청으로 전달하고 있었으니 백엔드가 400을 반환한 것이었습니다."
      ],

  document.getElementById("navCode").href = CONTENT.githubUrl;
  document.getElementById("footerGithub").href = CONTENT.githubUrl;

  document.getElementById("heroSection").innerHTML = `
    <span class="badge">${CONTENT.badge}</span>
    <h1>${CONTENT.title}</h1>
    <div class="meta">${CONTENT.meta}</div>
    <div class="link-row">
      ${CONTENT.links.map(l => `<a class="btn ${l.primary ? 'btn-primary' : 'btn-ghost'}" href="${l.href}">${l.label}</a>`).join("")}
    </div>
  `;

  const ov = CONTENT.overview;
  document.getElementById("overviewSection").innerHTML = `
    <h2>Overview</h2>
    ${ov.paragraphs.map(p => `<p>${p}</p>`).join("")}
    ${ov.facts && ov.facts.length ? `
      <div class="overview-facts">
        ${ov.facts.map(f => `<div class="fact-row"><div class="k">${f.k}</div><div class="v">${f.v}</div></div>`).join("")}
      </div>` : ""}
  `;

  if (CONTENT.myRole) {
    document.getElementById("roleSection").innerHTML = `
      <h2>담당 역할</h2>
      <p>${CONTENT.myRole.summary}</p>
      <ul class="role-list">
        ${CONTENT.myRole.items.map(r => `<li>${r.main}<span class="detail">${r.detail}</span></li>`).join("")}
      </ul>
    `;
  }

  document.getElementById("stackSection").innerHTML = `
    <h2>기술 스택</h2>
    <div class="stack-table">
      ${CONTENT.stack.map(s => `
        <div class="stack-row">
          <div class="cat">${s.cat}</div>
          <div class="val">
            <span class="names">${s.names}</span>
            ${s.note ? `<span class="note">${s.note}</span>` : ""}
          </div>
        </div>
      `).join("")}
    </div>
  `;

  const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  document.getElementById("storySection").innerHTML = `
    <h2>구현 과정</h2>
    ${CONTENT.stories.map(s => `
      <div class="story">
        <h3>${s.title}</h3>
        ${s.body.map(p => `<p>${p}</p>`).join("")}
        ${s.snippet ? `<pre class="snippet">${esc(s.snippet)}</pre>` : ""}
        ${s.bodyAfter ? s.bodyAfter.map(p => `<p>${p}</p>`).join("") : ""}
        ${s.aside && s.aside.length ? `<div class="aside">${s.aside.map(a => `<p>${a}</p>`).join("")}</div>` : ""}
        ${s.metrics && s.metrics.length ? `
          <div class="metric-line">
            ${s.metrics.map(m => `<div class="metric"><span class="v">${m.v}</span><span class="k">${m.k}</span></div>`).join("")}
          </div>` : ""}
      </div>
    `).join("")}
  `;

  if (CONTENT.retro) {
    document.getElementById("retroSection").innerHTML = `
      <h2>지금 다시 한다면</h2>
      <div class="retro">
        <p>${CONTENT.retro.intro}</p>
        <ul>${CONTENT.retro.items.map(i => `<li>${i}</li>`).join("")}</ul>
        <p style="margin-top:18px;">${CONTENT.retro.closing}</p>
      </div>
    `;
  }
}
render();
</script>
</body>
</html>
